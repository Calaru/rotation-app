<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ローテーション管理</title>

<style>
body{
    font-family: sans-serif;
    max-width: 600px;
    margin: 0 auto;
    padding: 20px;
    background:#f5f5f5;
}

h1{
    text-align:center;
}

.card{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

textarea{
    width:100%;
    height:180px;
    resize:none;
}

input[type="number"]{
    width:80px;
}

button{
    width:100%;
    padding:12px;
    font-size:16px;
    cursor:pointer;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
}

button:hover{
    background:#1d4ed8;
}

.result{
    font-size:20px;
    font-weight:bold;
    line-height:1.8;
}

.radio-group{
    margin-top:8px;
}
</style>
</head>
<body>

<h1>ローテーション管理</h1>

<div class="card">
    <h3>候補入力（1行1候補）</h3>

    <textarea id="candidates">A
B
C
D
E
F
G
H</textarea>
</div>

<div class="card">
    <h3>1セットの個数</h3>
    <input type="number" id="setSize" value="4" min="1">
</div>

<div class="card">
    <h3>選択方式</h3>

    <div class="radio-group">
        <label>
            <input type="radio" name="mode" value="manual">
            手動（未実装）
        </label>
    </div>

    <div class="radio-group">
        <label>
            <input type="radio" name="mode" value="random" checked>
            ランダム
        </label>
    </div>
</div>

<div class="card">
    <h3>ランダム方式</h3>

    <label>
        <input type="radio" name="randomMode" value="full" checked>
        完全ランダム
    </label>

    <br><br>

    <label>
        <input type="radio" name="randomMode" value="first">
        最初のみ指定（未実装）
    </label>
</div>

<div class="card">
    <button onclick="generateSet()">
        生成
    </button>
</div>

<div class="card">
    <h3>現在のセット</h3>

    <div id="result" class="result">
        まだ生成されていません
    </div>
</div>

<script>
function generateSet(){

    const text =
        document.getElementById("candidates").value;

    const candidates =
        text
        .split("\n")
        .map(v => v.trim())
        .filter(v => v !== "");

    const setSize =
        Number(
            document.getElementById("setSize").value
        );

    if(candidates.length < setSize){
        alert("候補数が足りません");
        return;
    }

    let pool = [...candidates];
    let result = [];

    for(let i=0;i<setSize;i++){

        const randomIndex =
            Math.floor(Math.random()*pool.length);

        result.push(pool[randomIndex]);

        pool.splice(randomIndex,1);
    }

    document.getElementById("result").innerHTML =
        result.join("<br>");
}
</script>

</body>
</html>
